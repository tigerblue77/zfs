# hddsim grid point G3: 16 MiB of the cache used for writes, whole stroke
# A 3.5" 7200 rpm SATA disk.  Calibration varies cache_mb and stroke only.
model=1
ncq=32
age_ms=1000
seek_min_ms=0.8
seek_max_ms=16
rpm=7200
rate_outer=200
rate_inner=100
stroke=1.0
overhead_us=100
iface_mbs=550
cache_mb=16
cache_hi=0.75
idle_ms=5
destage_kb=1024
seq_kb=1024
flush_blocks=1
seed=1
store_mb=512
