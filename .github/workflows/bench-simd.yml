# Runs bench-simd.sh on several GitHub-hosted runners, since only some of
# them have GFNI and AVX-512 (AMD EPYC Zen 4, Intel Ice Lake and later);
# a job on any other CPU stops after printing its model.
name: bench-simd
on: push
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: CPU
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -qwE 'gfni|avx512f' /proc/cpuinfo; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No GFNI or AVX-512 here: nothing to measure." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Benchmark
        if: steps.cpu.outputs.run == 'yes'
        run: |
          sudo ./bench-simd.sh "$RUNNER_TEMP/zb" | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sudo chmod -R a+rX "$RUNNER_TEMP/zb/results"
      - uses: actions/upload-artifact@v7
        if: steps.cpu.outputs.run == 'yes' && always()
        with:
          name: bench-${{ matrix.n }}
          path: ${{ runner.temp }}/zb/results
