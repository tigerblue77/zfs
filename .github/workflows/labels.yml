name: labels

on:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "== gh label list (GraphQL), probe labels:"
          gh label list --limit 1000 --json name --jq '.[].name' | grep '^zz-' || echo "(none)"
          echo "== REST labels, probe labels:"
          gh api --paginate "repos/$GH_REPO/labels" --jq '.[] | "\(.name) archived_at=\(.archived_at)"' | grep '^zz-'
          echo "== gh label create of the archived label:"
          gh label create zz-archived-probe --color ededed --description probe; echo "rc=$?"
          echo "== GraphQL query of the reviewed job:"
          gh api graphql --paginate -f owner="${GH_REPO%/*}" -f repo="${GH_REPO#*/}" -f query='
            query($owner: String!, $repo: String!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: [OPEN, CLOSED], first: 50, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    number
                    author { login }
                    headRefOid
                    labels(first: 100) { nodes { name } }
                    reviews(last: 100) {
                      nodes { author { __typename login } state submittedAt }
                    }
                    latestOpinionatedReviews(first: 100, writersOnly: true) {
                      nodes { state submittedAt commit { oid } }
                    }
                  }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes[] | select(.number >= 12) | {number, author: .author.login, reviews: .reviews.nodes, latest: .latestOpinionatedReviews.nodes}' | head -c 3000
          echo "rc=$?"
