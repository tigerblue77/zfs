name: zfs-qemu-cache

# Save in the Actions cache what each zfs-qemu.yml job would otherwise
# download before testing: the runner's packages (qemu-1-setup.sh) and the
# image of its OS (qemu-2-start.sh).  The jobs then download less, and still
# start when the Ubuntu archive or an image server is down.
#
# Only the default branch saves: every branch and pull request can restore
# its caches, while a pull request's own would serve that pull request only.
# The plan job computes the current keys and lists those the cache lacks;
# when it has them all, nothing else runs.  Otherwise the save job saves
# each missing entry, a few at a time.

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [ master ]
    paths:
      - .github/workflows/zfs-qemu-cache.yml
      - .github/workflows/zfs-qemu.yml
      - .github/workflows/scripts/qemu-1-setup.sh
      - .github/workflows/scripts/qemu-2-start.sh
  create:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QEMU_CACHE: /var/tmp/qemu-cache

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
    steps:
    - uses: actions/checkout@v6

    - name: Find missing caches
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        ZTS_OS_OVERRIDE: '["debian13", "freebsd15-1r"]'
      run: |
        scripts=.github/workflows/scripts
        tmp=$(mktemp -d)

        # The OSes that zfs-qemu.yml tests by default
        if jq -e 'type == "array"' <<< "$ZTS_OS_OVERRIDE" >/dev/null 2>&1 ; then
          jq -r '.[]' <<< "$ZTS_OS_OVERRIDE" > "$tmp/os"
        else
          sed -n "/^ *\*)$/,/;;/s/.*os_selection='\(.*\)'.*/\1/p" \
            .github/workflows/zfs-qemu.yml | jq -r '.[]' > "$tmp/os"
        fi
        if [ ! -s "$tmp/os" ] ; then
          echo "::error::No default OS list in zfs-qemu.yml"
          exit 1
        fi

        # The keys of the current packages and images, and the saved ones
        "$scripts/qemu-1-setup.sh" --cache-key | sed -n 's/^apt-key=//p' > "$tmp/apt"
        while read -r os ; do
          "$scripts/qemu-2-start.sh" --cache-key "$os" \
            < /dev/null > "$tmp/$os" 2> "$tmp/$os.log" &
        done < "$tmp/os"
        wait
        cat "$tmp"/*.log
        gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/caches" \
          -f ref="$GITHUB_REF" -f key=qemu- -f per_page=100 \
          --jq '.actions_caches[].key' > "$tmp/saved"

        # A key ending in "-unverified" has no server date to compare with.
        : > "$tmp/missing"
        key=$(cat "$tmp/apt")
        grep -qxF "$key" "$tmp/saved" ||
          jq -nc --arg key "$key" '{cache: "apt", key: $key, os: ""}' \
            >> "$tmp/missing"
        while read -r os ; do
          key=$(sed -n 's/^image-key=//p' "$tmp/$os")
          case "$key" in ""|*-unverified) continue ;; esac
          grep -qxF "$key" "$tmp/saved" ||
            jq -nc --arg key "$key" --arg os "$os" \
              '{cache: "image", key: $key, os: $os}' >> "$tmp/missing"
        done < "$tmp/os"
        echo "Entries to save: $(wc -l < "$tmp/missing")"
        cat "$tmp/missing"
        echo "missing=$(jq -sc . "$tmp/missing")" >> "$GITHUB_OUTPUT"


    - name: Packages the fixed pattern selects (test only)
      run: |
        eval "$(sed -n '/^unneeded=/,/chromium"$/p' .github/workflows/scripts/qemu-1-setup.sh)"
        dpkg-query -f '${binary:Package}\n' -W > /tmp/all
        grep -E "'$unneeded'" /tmp/all > /tmp/old || true
        grep -E "$unneeded" /tmp/all > /tmp/new || true
        echo "selected: old $(wc -l < /tmp/old), new $(wc -l < /tmp/new)"
        diff /tmp/old /tmp/new || true
        grep -i -E "chromium|edge" /tmp/all || true
        apt-get -s remove $(cat /tmp/old) | grep '^Remv' | sort > /tmp/remv-old
        apt-get -s remove $(cat /tmp/new) | grep '^Remv' | sort > /tmp/remv-new
        echo "removed: old $(wc -l < /tmp/remv-old), new $(wc -l < /tmp/remv-new)"
        diff /tmp/remv-old /tmp/remv-new && echo "same removal"

  save:
    name: Save
    needs: [ plan ]
    if: needs.plan.outputs.missing != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.missing) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Download ${{ matrix.os || matrix.cache }}
      env:
        CACHE: ${{ matrix.cache }}
        OS: ${{ matrix.os }}
      run: |
        if [ "$CACHE" = "apt" ] ; then
          .github/workflows/scripts/qemu-1-setup.sh
        else
          .github/workflows/scripts/qemu-2-start.sh --download "$OS"
        fi

    - uses: actions/cache/save@v6
      with:
        path: ${{ env.QEMU_CACHE }}/${{ matrix.cache }}
        key: ${{ matrix.key }}

  # Test only: what the next scheduled run would do, once the entries above
  # are saved.
  replan:
    name: Plan again (test only)
    needs: [ plan, save ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v6
    - name: Find missing caches again, warm (test only)
      env:
        GH_TOKEN: ${{ github.token }}
        ZTS_OS_OVERRIDE: '["debian13", "freebsd15-1r"]'
      run: |
        scripts=.github/workflows/scripts
        tmp=$(mktemp -d)

        # The OSes that zfs-qemu.yml tests by default
        if jq -e 'type == "array"' <<< "$ZTS_OS_OVERRIDE" >/dev/null 2>&1 ; then
          jq -r '.[]' <<< "$ZTS_OS_OVERRIDE" > "$tmp/os"
        else
          sed -n "/^ *\*)$/,/;;/s/.*os_selection='\(.*\)'.*/\1/p" \
            .github/workflows/zfs-qemu.yml | jq -r '.[]' > "$tmp/os"
        fi
        if [ ! -s "$tmp/os" ] ; then
          echo "::error::No default OS list in zfs-qemu.yml"
          exit 1
        fi

        # The keys of the current packages and images, and the saved ones
        "$scripts/qemu-1-setup.sh" --cache-key | sed -n 's/^apt-key=//p' > "$tmp/apt"
        while read -r os ; do
          "$scripts/qemu-2-start.sh" --cache-key "$os" \
            < /dev/null > "$tmp/$os" 2> "$tmp/$os.log" &
        done < "$tmp/os"
        wait
        cat "$tmp"/*.log
        gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/caches" \
          -f ref="$GITHUB_REF" -f key=qemu- -f per_page=100 \
          --jq '.actions_caches[].key' > "$tmp/saved"

        # A key ending in "-unverified" has no server date to compare with.
        : > "$tmp/missing"
        key=$(cat "$tmp/apt")
        grep -qxF "$key" "$tmp/saved" ||
          jq -nc --arg key "$key" '{cache: "apt", key: $key, os: ""}' \
            >> "$tmp/missing"
        while read -r os ; do
          key=$(sed -n 's/^image-key=//p' "$tmp/$os")
          case "$key" in ""|*-unverified) continue ;; esac
          grep -qxF "$key" "$tmp/saved" ||
            jq -nc --arg key "$key" --arg os "$os" \
              '{cache: "image", key: $key, os: $os}' >> "$tmp/missing"
        done < "$tmp/os"
        echo "Entries to save: $(wc -l < "$tmp/missing")"
        cat "$tmp/missing"
        echo "missing=$(jq -sc . "$tmp/missing")" >> "$GITHUB_OUTPUT"

    - name: Look up entry 0 saved by this run (test only)
      if: ${{ fromJson(needs.plan.outputs.missing)[0] != null }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.QEMU_CACHE }}/${{ fromJson(needs.plan.outputs.missing)[0].cache }}
        key: ${{ fromJson(needs.plan.outputs.missing)[0].key }}
        lookup-only: true
        fail-on-cache-miss: true
    - name: Look up entry 1 saved by this run (test only)
      if: ${{ fromJson(needs.plan.outputs.missing)[1] != null }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.QEMU_CACHE }}/${{ fromJson(needs.plan.outputs.missing)[1].cache }}
        key: ${{ fromJson(needs.plan.outputs.missing)[1].key }}
        lookup-only: true
        fail-on-cache-miss: true
    - name: Look up entry 2 saved by this run (test only)
      if: ${{ fromJson(needs.plan.outputs.missing)[2] != null }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.QEMU_CACHE }}/${{ fromJson(needs.plan.outputs.missing)[2].cache }}
        key: ${{ fromJson(needs.plan.outputs.missing)[2].key }}
        lookup-only: true
        fail-on-cache-miss: true
    - name: Find missing caches during an outage (test only)
      env:
        GH_TOKEN: ${{ github.token }}
        ZTS_OS_OVERRIDE: '["debian13", "freebsd15-1r"]'
      run: |
        for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com \
            cloud-images.ubuntu.com cloud.debian.org download.freebsd.org ; do
          echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
        done
        scripts=.github/workflows/scripts
        tmp=$(mktemp -d)

        # The OSes that zfs-qemu.yml tests by default
        if jq -e 'type == "array"' <<< "$ZTS_OS_OVERRIDE" >/dev/null 2>&1 ; then
          jq -r '.[]' <<< "$ZTS_OS_OVERRIDE" > "$tmp/os"
        else
          sed -n "/^ *\*)$/,/;;/s/.*os_selection='\(.*\)'.*/\1/p" \
            .github/workflows/zfs-qemu.yml | jq -r '.[]' > "$tmp/os"
        fi
        if [ ! -s "$tmp/os" ] ; then
          echo "::error::No default OS list in zfs-qemu.yml"
          exit 1
        fi

        # The keys of the current packages and images, and the saved ones
        "$scripts/qemu-1-setup.sh" --cache-key | sed -n 's/^apt-key=//p' > "$tmp/apt"
        while read -r os ; do
          "$scripts/qemu-2-start.sh" --cache-key "$os" \
            < /dev/null > "$tmp/$os" 2> "$tmp/$os.log" &
        done < "$tmp/os"
        wait
        cat "$tmp"/*.log
        gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/caches" \
          -f ref="$GITHUB_REF" -f key=qemu- -f per_page=100 \
          --jq '.actions_caches[].key' > "$tmp/saved"

        # A key ending in "-unverified" has no server date to compare with.
        : > "$tmp/missing"
        key=$(cat "$tmp/apt")
        grep -qxF "$key" "$tmp/saved" ||
          jq -nc --arg key "$key" '{cache: "apt", key: $key, os: ""}' \
            >> "$tmp/missing"
        while read -r os ; do
          key=$(sed -n 's/^image-key=//p' "$tmp/$os")
          case "$key" in ""|*-unverified) continue ;; esac
          grep -qxF "$key" "$tmp/saved" ||
            jq -nc --arg key "$key" --arg os "$os" \
              '{cache: "image", key: $key, os: $os}' >> "$tmp/missing"
        done < "$tmp/os"
        echo "Entries to save: $(wc -l < "$tmp/missing")"
        cat "$tmp/missing"
        echo "missing=$(jq -sc . "$tmp/missing")" >> "$GITHUB_OUTPUT"

