# Fork-only experiment, not meant for upstream: interference between slow
# pools and a fast pool on the same host, one suspected cause removed per
# phase (tests/perf-xpool/run.sh qv), measured on GitHub-hosted runners with
# this branch's modules loaded.  The other workflows are removed from this
# branch so that a push runs only this one.
name: perf-xpool

on:
  push:
    branches: [perf-xpool-cause]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-xpool-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  perf:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: y1
            pools: "1"
            wl: "rr1 rr4 sw1 sw4"
            wmb: "1024"
            rmb: "0"
            arc: "2147483648"
            dirty: "1610612736"
            phases: >-
              alone:none sw:write:diag sw-w:write:kn=w sw-wy:write:kn=wy
              sw-w2:write:kn=w2 sw-idle:write:idle sw-all:write:kn=all,diag
              alone-all:none:kn=all alone2:none
          - name: y3
            pools: "3n"
            wl: "rr1 rr4 sw1 sw4"
            wmb: "256"
            rmb: "0"
            arc: "2147483648"
            dirty: "1610612736"
            fastmb: "1024"
            phases: >-
              alone:none m3w:write:diag m3w-w:write:kn=w m3w-wy:write:kn=wy
              m3w-w2:write:kn=w2 m3w-idle:write:idle m3w-all:write:kn=all,diag
              alone2:none
          - name: yr
            pools: "1"
            wl: "rr1 rr4 sw1 sw4"
            wmb: "256"
            rmb: "2560"
            arc: "2147483648"
            dirty: "1610612736"
            phases: >-
              alone:none sr:read:diag sr-r:read:kn=r sr-r2:read:kn=r2
              sr-all:read:kn=all,diag alone2:none
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Runner
        run: |
          uname -a
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Hypervisor|MHz'
          free -m
          df -h / /mnt || true
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y -q
          sudo apt-get install -y -q --no-install-recommends \
            autoconf automake libtool gawk build-essential \
            libblkid-dev uuid-dev libudev-dev libssl-dev zlib1g-dev \
            libaio-dev libattr1-dev libelf-dev libtirpc-dev libffi-dev \
            libcurl4-openssl-dev libpam0g-dev python3 python3-dev \
            "linux-headers-$(uname -r)" fio bpftrace dmsetup sysstat \
            linux-tools-common > apt.log 2>&1 || { tail -30 apt.log; exit 1; }
          sudo apt-get install -y -q --no-install-recommends \
            "linux-tools-$(uname -r)" >> apt.log 2>&1 ||
            echo "linux-tools-$(uname -r) not installed"
          sudo apt-get install -y -q --no-install-recommends \
            "linux-modules-extra-$(uname -r)" >> apt.log 2>&1 ||
            echo "linux-modules-extra-$(uname -r) not installed"
          for m in null_blk dm_delay; do
            modinfo -F filename "$m" || echo "$m: not found"
          done
          fio --version; bpftrace --version; perf --version || true
      - name: Build
        run: |
          ./autogen.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
          ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
            --disable-pyzfs >> build.log 2>&1 || { tail -60 build.log; exit 1; }
          make -j"$(nproc)" >> build.log 2>&1 ||
            { grep -n -m 20 -E 'error|Error' build.log; tail -40 build.log; exit 1; }
          tail -2 build.log
      - name: Install and load modules
        run: |
          sudo make install > install.log 2>&1 || { tail -40 install.log; exit 1; }
          # Move Ubuntu's own zfs/spl modules out of the way so that
          # modprobe picks the ones just built.
          for d in $(find "/lib/modules/$(uname -r)/kernel" -type d -name zfs); do
            sudo mv "$d" "/var/tmp/ubuntu-$(basename "$(dirname "$d")")-zfs"
          done
          sudo ldconfig
          sudo depmod -a
          sudo udevadm control --reload-rules || true
          modinfo -F filename spl zfs
          sudo ./scripts/zfs.sh -v
          cat /sys/module/zfs/version
          zfs version
      - name: Experiment
        timeout-minutes: 140
        env:
          QV_POOLS: ${{ matrix.pools }}
          QV_PHASES: ${{ matrix.phases }}
          QV_WL: ${{ matrix.wl }}
          QV_SLOW_WRITE_MB: ${{ matrix.wmb }}
          QV_READ_MB: ${{ matrix.rmb }}
          ARC_MAX: ${{ matrix.arc }}
          Q2_DIRTY_MAX: ${{ matrix.dirty }}
          FAST_DEV_MB: ${{ matrix.fastmb || '2048' }}
          REPS: "3"
          Q2_RUNTIME: "20"
          DIAG_RUNTIME: "20"
        run: |
          sudo -E OUT=/var/tmp/perf-xpool/${{ matrix.name }} \
            tests/perf-xpool/run.sh qv
      - name: Summary
        if: always()
        run: |
          sudo chmod -R a+rX /var/tmp/perf-xpool || true
          d=/var/tmp/perf-xpool/${{ matrix.name }}
          {
            echo "### ${{ matrix.name }} on $(uname -r), $(nproc) CPUs"
            grep -m1 'Model name' "$d/system.txt" || true
            grep -E '^(zfs |fio-|bpftrace|perf version|null_blk)' "$d/system.txt" || true
            cat "$d/params.txt" 2>/dev/null | tr '\n' ' '; echo
            python3 tests/perf-xpool/report.py qv "$d"
          } > summary.txt 2>&1
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=== PERF-XPOOL SUMMARY ${{ matrix.name }} ==="
          cat summary.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-xpool-${{ matrix.name }}
          path: /var/tmp/perf-xpool/${{ matrix.name }}
          retention-days: 14
